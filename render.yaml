# Render Blueprint: one free web service built from ./Dockerfile.
# The two model keys are asked for when the Blueprint is created (sync: false).
services:
  - type: web
    name: tracecheck
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    autoDeploy: false
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ZHIPU_API_KEY
        sync: false
      - key: AI_DAILY_LIMIT
        value: "40"
      - key: AI_PER_IP_DAILY
        value: "3"
