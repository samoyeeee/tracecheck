<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TraceCheck 评测总览</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/common.js"></script>
</head>
<body>
<header class="top"><div class="in">
  <span class="brand">TraceCheck</span>
  <nav><a href="index.html">分析一条记录</a><a href="audit.html">案例库</a><a href="overview.html">评测总览</a><a href="regression.html">回归对比</a></nav>
</div></header>
<main id="app"><p class="note">加载中…</p></main>
<script>
function bars(counts, total) {
  const max = Math.max(...Object.values(counts), 1);
  return `<div class="bars">${Object.entries(counts).map(([k, n]) => `
    <div class="row"><div>${k}</div>
      <div class="track"><div class="fill" style="width:${(n / max) * 100}%"></div></div>
      <div class="n">${n}${total ? ` <span class="note">${pct(n / total, 0)}</span>` : ""}</div></div>`).join("")}</div>`;
}

const REASON_ZH = {
  db_mismatch: "数据库结果与标准答案不一致",
  db_ok_but_nl_assertion_failed: "数据库一致，但回复内容不达标",
  "terminated: max_steps": "超过最大步数被终止",
  "terminated: too_many_errors": "错误过多被终止",
};

loadData("overview").then((o) => {
  const b = o.baseline, v = o.verify, c = o.categories, cost = o.cost.v;
  const acc = c.investigator_accuracy.v;
  document.getElementById("app").innerHTML = `
    <h1>评测总览</h1>
    <p class="sub">TraceCheck 在 τ²-bench retail 上的评测：先让一个客服 agent 跑 114 个任务产生失败，再看 TraceCheck 能否把失败找出来、说清楚。τ²-bench retail，114 个任务 × 每个 ${b.k.v} 次。被测 agent：${esc(o.models.agent)}；
      用户模拟：${esc(o.models.user)}；评委：${esc(o.models.judge)}；调查器：${esc(o.models.investigator)}。
      页面上所有数字都来自真实运行，点“来源”可看原始文件。</p>

    <div class="grid tiles">
      <div class="panel tile"><div class="label">基线成功率 pass^1 ${src(b.pass1.src)}</div>
        <div class="value">${pct(b.pass1.v)}</div><div class="hint">${b.successful_runs.v} / ${b.runs.v} 次运行成功</div></div>
      <div class="panel tile"><div class="label">pass^4（4 次全成功）${src(b.pass4.src)}</div>
        <div class="value">${pct(b.pass4.v)}</div><div class="hint">衡量稳定性</div></div>
      <div class="panel tile"><div class="label">失败运行 ${src(b.failed_runs.src)}</div>
        <div class="value">${b.failed_runs.v}</div><div class="hint">τ² 判定 reward &lt; 1</div></div>
      <div class="panel tile"><div class="label">失败中有异常信号 ${src(v.any_signal.src)}</div>
        <div class="value">${pct(v.any_signal.v.rate)}</div>
        <div class="hint">${v.any_signal.v.n}/${v.any_signal.v.of}；成功运行误标 ${nOf(v.any_signal.v.flagged_passing_runs)}</div></div>
      <div class="panel tile"><div class="label">假成功（说办好了但没办对）${src(v.false_success.src)}</div>
        <div class="value">${v.false_success.v.n}</div>
        <div class="hint">占失败 ${pct(v.false_success.v.rate)}；人工抽查准确率：${v.precision.v === null ? "未测" : pct(v.precision.v)}</div></div>
      <div class="panel tile"><div class="label">总花费 ${src(o.cost.src)}</div>
        <div class="value">$${cost.billed_usd.toFixed(2)}</div>
        <div class="hint">${cost.calls.toLocaleString()} 次模型调用，免费档</div></div>
    </div>

    <h2>失败原因（τ² 自带判定）${src(b.failed_reasons.src)}</h2>
    <div class="panel">${bars(Object.fromEntries(Object.entries(b.failed_reasons.v).map(([k, n]) => [REASON_ZH[k] || k, n])), b.failed_runs.v)}</div>

    <h2>按失败类别分布（AI 推断）${src(c.answered_by_category.src)}</h2>
    <div class="panel">
      <p class="note" style="margin-top:0">每个有失败的任务取 1 条未被规则解释的失败轨迹，共 ${c.candidates.v} 条，已诊断 ${c.diagnosed.v} 条。
        调查器 3 次采样一致且证据可在原文找到才作答，否则弃权。
        作答 ${c.answered.v} 条，弃权 ${c.abstained.v} 条。另有 ${c.errors.v} 条在 3 次采样里至少有 1 次回复无法解析。</p>
      <h3>作答的 ${c.answered.v} 条</h3>
      ${bars(Object.fromEntries(Object.entries(c.answered_by_category.v).map(([k, n]) => [zhCat(k), n])), c.answered.v)}
      <div class="banner warn" style="margin-top:12px">
        <b>可信度提示：</b>同一调查器在 AgentRx 人工标注测试集上，作答时类别正确率 ${nOf(acc.category_answered)}，
        关键步骤（±1 步）正确率 ${nOf(acc.step_within_1_answered)}，弃权率 ${nOf(acc.abstain)}。
        所以这里的分布只能当方向参考，不是结论。${src(c.investigator_accuracy.src)}
      </div>
      <p class="note">同一批轨迹让调查器重跑一次（输入只多了一条“转人工”观察）：两次都作答的
        ${c.stability.v.answered_in_both} 条里，类别和关键步骤一致 ${c.stability.v.answered_in_both_same_category_and_step} 条；
        但“作答还是弃权”只有 ${c.stability.v.abstain_decision_same}/${c.stability.v.without_parse_errors_in_either} 条一致。${src(c.stability.src)}</p>
    </div>

    <h2>花费明细 ${src(o.cost.src)}</h2>
    <div class="panel scroll-x"><table>
      <tr><th>模型</th><th class="num">调用次数</th><th class="num">成功</th><th class="num">tokens</th></tr>
      ${Object.entries(cost.by_model).map(([m, r]) => `<tr><td>${esc(m)}</td><td class="num">${r.calls.toLocaleString()}</td>
        <td class="num">${(r.ok || 0).toLocaleString()}</td><td class="num">${r.tokens.toLocaleString()}</td></tr>`).join("")}
      <tr><th>合计</th><th class="num">${cost.calls.toLocaleString()}</th><th></th><th class="num">${cost.tokens.toLocaleString()}</th></tr>
    </table>
    <p class="note">全部使用免费档，实际账单 $${cost.billed_usd.toFixed(2)}。</p></div>
  `;
}).catch((e) => fail(document.getElementById("app"), e));
</script>
</body>
</html>
