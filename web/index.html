<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TraceCheck 分析</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/common.js"></script>
<script src="assets/card.js"></script>
</head>
<body>
<header class="top"><div class="in">
  <span class="brand">TraceCheck</span>
  <nav><a href="index.html">分析一条记录</a><a href="audit.html">案例库</a><a href="overview.html">评测总览</a><a href="regression.html">回归对比</a></nav>
</div></header>
<main>
  <h1>这条 agent 运行记录，哪一步出错了？</h1>
  <p class="sub">把一条客服 agent 的运行记录交给 TraceCheck，它分三层检查：
    <b>① 规则检查</b>（有没有违反政策、工具报错）→ <b>② 数据库核验</b>（agent 说“办好了”的事，数据库里是不是真的办对了）→
    <b>③ 调查 agent</b>（读完整条记录，指出最早的关键错误和证据；没把握就弃权）。前两层是确定性的程序，第三层是模型。</p>

  <div id="mode"></div>

  <div class="panel" id="input">
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="sample">选一条样例</button>
      <button class="tab" data-tab="upload">上传文件</button>
      <button class="tab" data-tab="paste">粘贴 JSON</button>
    </div>
    <div class="tabpane" data-pane="sample"><select id="sample" style="width:100%"></select></div>
    <div class="tabpane" data-pane="upload" hidden>
      <input type="file" id="file" accept=".json,application/json">
      <p class="note">τ²-bench retail 的单次运行记录（例如 <code>results/runs/v1/task_2__trial_0.json</code>），需要有 <code>task_id</code> 和 <code>messages</code>。</p>
    </div>
    <div class="tabpane" data-pane="paste" hidden>
      <textarea id="paste" rows="6" style="width:100%; font-family: var(--mono); font-size: 12.5px" placeholder='{"task_id": "2", "messages": [...], ...}'></textarea>
    </div>
    <div class="decide" style="margin-top:10px">
      <label><input type="checkbox" id="useInv" checked> 运行调查 agent（第 ③ 层，调用 3 次模型）</label>
      <button class="primary" id="go">开始分析</button>
    </div>
    <div id="progress" class="pipeline"></div>
  </div>

  <div id="result" style="margin-top:14px"></div>
</main>
<script>
let LOCAL = null, AUDIT = null;

const STAGES = [["rules", "① 规则检查"], ["db", "② 数据库核验"], ["inv", "③ 调查 agent"]];
function progress(state) {  // state: {rules: "done"|"run"|"skip"|"fail", ...}
  document.getElementById("progress").innerHTML = STAGES.map(([k, label]) => {
    const s = state[k] || "wait";
    const txt = { wait: "等待", run: "运行中…", done: "完成", skip: "未运行", fail: "失败", pre: "预先运行" }[s];
    return `<span class="stage ${s}">${label}：${txt}</span>`;
  }).join("");
}

function showError(msg) { document.getElementById("result").innerHTML = `<div class="banner bad">${esc(msg)}</div>`; }

function headerFor(c, note) {
  return `<div class="panel" style="margin-bottom:12px">
    <div><b>任务 ${esc(c.task_id)}${c.trial !== null && c.trial !== undefined ? `，第 ${c.trial} 次运行` : ""}</b> ${note}</div>
    <div class="note">用户目标：${esc(c.user_goal)}</div>
    <div style="margin-top:6px">${verdictLine(c)}</div></div>`;
}

// One-line answer to "what went wrong", built only from what the layers found.
function verdictLine(c) {
  const t = c.tau2, d = c.diagnosis, bits = [];
  if (t.reward === 1) bits.push(`<span class="tag good">τ² 判定成功</span>`);
  else bits.push(`<span class="tag bad">τ² 判定失败</span>`);
  if (t.false_success) bits.push(`<span class="tag bad">假成功：说办好了但没办对</span>`);
  const v = c.findings.filter((f) => f.severity === "violation");
  if (v.length) bits.push(`<span class="tag bad">${v.length} 条违规</span>`);
  if (d && !d.abstain) bits.push(`<span class="tag">调查 agent：步骤 ${d.critical_step} · ${esc(CATEGORY_ZH[d.category] || d.category)}</span>`);
  if (d && d.abstain) bits.push(`<span class="tag warn">调查 agent 弃权</span>`);
  return bits.join(" ");
}

function show(c, note, pending) {
  document.getElementById("result").innerHTML = renderCard(c, { header: headerFor(c, note), pending });
  const d = c.diagnosis;
  const first = d && d.critical_step !== null ? d.critical_step
    : (c.claims[0] || c.findings.find((f) => f.severity === "violation") || {}).step;
  if (first !== undefined) setTimeout(() => scrollTimelineTo(first), 30);
}

async function post(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

async function readInput() {
  const tab = document.querySelector(".tab.on").dataset.tab;
  if (tab === "sample") return { sample: document.getElementById("sample").value };
  if (tab === "upload") {
    const f = document.getElementById("file").files[0];
    if (!f) throw new Error("请先选择一个 JSON 文件。");
    return { trajectory: JSON.parse(await f.text()) };
  }
  const text = document.getElementById("paste").value.trim();
  if (!text) throw new Error("请先粘贴一条运行记录。");
  try { return { trajectory: JSON.parse(text) }; } catch (e) { throw new Error(`不是合法的 JSON：${e.message}`); }
}

async function run() {
  const go = document.getElementById("go");
  go.disabled = true;
  try {
    const input = await readInput();
    const useInv = document.getElementById("useInv").checked && !document.getElementById("useInv").disabled;
    if (!LOCAL) {  // online demo: pre-computed results only
      const c = AUDIT.cases.find((x) => x.id === input.sample);
      progress({ rules: "pre", db: "pre", inv: "pre" });
      return show(c, `<span class="tag warn">预先运行的结果</span> ${src(c.file)}`);
    }
    progress({ rules: "run", db: "run" });
    document.getElementById("result").innerHTML = "";
    const body = input.sample ? { file: input.sample } : { trajectory: input.trajectory };
    const { case: c, token } = await post("/api/analyze", body);
    progress({ rules: "done", db: "done", inv: useInv ? "run" : "skip" });
    const note = input.sample ? src(input.sample) : `<span class="note">（你上传的记录）</span>`;
    show(c, note, useInv ? `<span class="note">调查 agent 正在读这条记录（3 次采样，约 10–60 秒）…</span>` : "");
    if (!useInv) return;
    try {
      const { case: full } = await post("/api/investigate", { token });
      progress({ rules: "done", db: "done", inv: "done" });
      show(full, note);
    } catch (e) {
      progress({ rules: "done", db: "done", inv: "fail" });
      show(c, note, `<div class="banner bad">调查 agent 失败：${esc(e.message)}</div>`);
    }
  } catch (e) {
    progress({});
    showError(e.message);
  } finally { go.disabled = false; }
}

document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
  document.querySelectorAll(".tabpane").forEach((p) => { p.hidden = p.dataset.pane !== b.dataset.tab; });
}));
document.getElementById("go").addEventListener("click", run);

(async () => {
  try {
    const res = await fetch("/api/status");
    LOCAL = res.ok ? await res.json() : null;
  } catch { LOCAL = null; }
  const mode = document.getElementById("mode"), sel = document.getElementById("sample"), inv = document.getElementById("useInv");
  if (LOCAL) {
    mode.innerHTML = `<div class="banner good" style="margin-bottom:12px">本地模式：会对你选的记录实时运行 TraceCheck。
      调查 agent：${LOCAL.investigator ? `已启用（${esc(LOCAL.model)}，用你本机的 key，会记入 results/cost_log.csv）` : "未启用，需要设置环境变量 GEMINI_API_KEY 后重启"}。</div>`;
    if (!LOCAL.investigator) { inv.checked = false; inv.disabled = true; }
    const { samples } = await (await fetch("/api/samples")).json();
    const TAG_ZH = { v1: "v1", v2: "v2", bug_addr2: "埋 bug：清空地址第二行", bug_dropitem: "埋 bug：漏掉最后一件" };
    sel.innerHTML = samples.map((s) => `<option value="${esc(s.file)}">${esc(TAG_ZH[s.tag] || s.tag)} · 任务 ${esc(s.task_id)} · 第 ${s.trial} 次 · ${s.success ? "成功" : "失败"}${s.false_success ? " · 假成功" : ""}</option>`).join("");
  } else {
    AUDIT = await loadData("audit");
    mode.innerHTML = `<div class="banner warn" style="margin-bottom:12px"><b>线上展示版：</b>这里不能分析新记录，因为调查 agent 要调用模型，公开网页不能放 API key。
      下面只能选预先分析好的 ${AUDIT.cases.length} 条记录，看到的都是<b>预先运行的结果</b>。
      想分析自己的记录：在本地运行 <code>python -m web.serve</code>（见 README）。</div>`;
    document.querySelectorAll('.tab[data-tab="upload"], .tab[data-tab="paste"]').forEach((b) => { b.disabled = true; b.title = "仅本地模式可用"; });
    inv.disabled = true;
    sel.innerHTML = AUDIT.cases.map((c) => `<option value="${esc(c.id)}">任务 ${esc(c.task_id)} · 第 ${c.trial} 次 · ${c.diagnosis.abstain ? "调查 agent 弃权" : esc(CATEGORY_ZH[c.diagnosis.category] || c.diagnosis.category)}</option>`).join("");
  }
  progress({});
})();
</script>
</body>
</html>
